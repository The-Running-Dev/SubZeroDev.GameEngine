name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  docs:
    permissions: { contents: read, pages: write, id-token: write }
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/docs.yml@v0
    with:
      output: artifacts/docs
      changelog: docs/docs/engine/CHANGELOG.md
      changelog-front-matter: 'slug: changelog'
      pre-build: ./build/Test-Documentation.ps1
      # The landing page is built, browser-tested and merged into the documentation build.
      node-project: site
      node-scripts: check merge
      node-dependencies: src/engine
      browser: true
