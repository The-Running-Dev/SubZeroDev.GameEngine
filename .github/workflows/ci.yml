name: CI

# Branches are covered by `pull_request`; `main` by `push`. Restricting push to
# main is what stops a branch with an open PR producing two runs of this
# workflow.
#
# An earlier version triggered on every push *and* pull_request, deduplicated by
# a concurrency group with cancel-in-progress. That raced: whichever run started
# second cancelled the first, leaving two check-runs on one commit -- one success,
# one cancelled -- and a required-status-check rule that sees the cancelled one
# blocks the merge even though everything passed.
#
# No `paths` filter on either trigger: `engine / Result` is a required status check on
# `main`'s ruleset, and a workflow run that never starts because no matching path
# changed means the required check never reports at all.
"on":
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions: {}

# Only reachable for pushes to main now, since a PR branch produces a single
# run. cancel-in-progress is still right there: consecutive pushes to main
# supersede each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always runs, on every event including a tag push -- a tag can in principle be cut
  # against a commit that was never itself verified as a branch push or a checked PR, so
  # this is the one place every ref actually gets typecheck/lint/test.
  #
  # The package half (pack, inspect the tarball with the release workflow's own archive
  # guard, consumer smoke against that tarball) is build/Test-EnginePackage.ps1.
  engine:
    permissions:
      contents: read
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/node-ci.yml@v0
    with:
      working-directory: src/engine
      node-versions: '["24"]'
      scripts: typecheck lint test
      cache: npm
      cache-dependency-path: src/engine/package-lock.json
      post-build: build/Test-EnginePackage.ps1
      timeout-minutes: 10

  # Parse-checks every PowerShell script. There are no Pester tests in the repository
  # (tools/ holds none), so this is not a pwsh-ci.yml call: that workflow always runs
  # Pester and fails on zero tests. Move to pwsh-ci.yml when the first *.Tests.ps1 lands.
  powershell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: The-Running-Dev/GitHub-ActionTemplates/actions/pwsh-check@v0
        with:
          paths: .

  # The replay regression oracle's cross-version comparison (07-replay.md §8): on every
  # release tag, run *this* tag's engine against the *previous* tag's own fixture
  # submissions and committed .outcome.json files together -- the "did this change alter a
  # game that already exists" question, distinct from the engine job's own test run, which
  # only compares a build against its own commit's corpus (07-replay.md §1). The logic is
  # build/Test-ReplayOracle.ps1; it skips cleanly when there is no previous tag yet.
  replay:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # actions/checkout defaults fetch-tags to false, and fetch-depth: 0 alone did not bring
      # sibling tags on a tag-triggered run (pushing v0.2.0 found "No previous tag before
      # v0.2.0" while v0.1.0 was on origin), so ask for them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/engine/package-lock.json

      - name: Install dependencies
        working-directory: src/engine
        run: npm ci

      - name: Replay oracle
        run: pwsh -NoProfile -File ./build/Test-ReplayOracle.ps1
