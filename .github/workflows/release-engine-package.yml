name: release-engine-package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish game-engine package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: Configure scoped registry
        working-directory: src/engine
        run: |
          npm config set @the-running-dev:registry https://npm.pkg.github.com

      - name: Install dependencies
        working-directory: src/engine
        run: npm ci

      - name: Publish package
        working-directory: src/engine
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > .npmrc
          npm publish
