name: release-engine-package

# Two paths through one job, so the guards that gate a publication are the guards a
# validation run exercises (W108.5):
#
#   * `push` of a `v*` tag  -> mode `publish`. The only path that reaches `npm publish`.
#   * `workflow_dispatch` / `pull_request` -> mode `validate`. Same guards, same pack, same
#     archive inspection, same consumer smoke, plus the guard negatives — and the publish
#     step is unreachable, because `mode` only ever returns `publish` for a real tag push.
#
# Before this split the guards could only run by pushing a tag, which is why the
# escaped-quote bug that failed the `v0.10.0` run (run 33721497785) was fixed blind and
# never executed. The guard logic itself now lives in `src/engine/scripts/verify-release.mjs`
# so it is unit-tested (`scripts/verify-release.test.ts`) rather than inlined here; the
# stages that sequence it live in `build/Invoke-EngineRelease.ps1`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Prospective release tag to validate, e.g. v0.11.0. Nothing is published."
        required: true
        type: string
  pull_request:
    paths:
      - "src/engine/package.json"
      - "src/engine/package-lock.json"
      - "src/engine/scripts/verify-release.mjs"
      - "src/engine/scripts/verify-release.test.ts"
      - "src/engine/scripts/stage-license.mjs"
      - "build/Invoke-EngineRelease.ps1"
      - "LICENSE"
      - ".github/workflows/release-engine-package.yml"

permissions: {}

jobs:
  release:
    name: release game-engine package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: Resolve release mode and tag
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: pwsh -NoProfile -File ./build/Invoke-EngineRelease.ps1 -Stage Mode

      - name: Guard - the tag and the manifest name the same release
        working-directory: src/engine
        env:
          TAG: ${{ steps.mode.outputs.tag }}
        run: node scripts/verify-release.mjs tag --tag "$TAG"

      - name: Guard - the candidate is a committed tree
        working-directory: src/engine
        run: node scripts/verify-release.mjs clean --root "$GITHUB_WORKSPACE"

      - name: Guard - this version is not already published
        id: registry
        continue-on-error: ${{ steps.mode.outputs.mode != 'publish' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pwsh -NoProfile -File ./build/Invoke-EngineRelease.ps1 -Stage Registry

      - name: Record the registry guard's outcome
        if: always()
        env:
          REGISTRY_OUTCOME: ${{ steps.registry.outcome }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: pwsh -NoProfile -File ./build/Invoke-EngineRelease.ps1 -Stage RegistryOutcome

      - name: Verify engine
        uses: The-Running-Dev/GitHub-ActionTemplates/actions/node-scripts@v0
        with:
          path: src/engine
          scripts: typecheck lint test

      - name: Pack clean package
        id: pack
        run: pwsh -NoProfile -File ./build/Invoke-EngineRelease.ps1 -Stage Pack

      - name: Guard - inspect the archive and record its digest
        id: archive
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: pwsh -NoProfile -File ./build/Invoke-EngineRelease.ps1 -Stage Archive

      - name: Verify packed consumer against that archive
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: pwsh -NoProfile -File ./build/Invoke-EngineRelease.ps1 -Stage Consumer

      - name: Guard - the archive the consumer used is still the inspected archive
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          DIGEST: ${{ steps.archive.outputs.digest }}
        run: pwsh -NoProfile -File ./build/Invoke-EngineRelease.ps1 -Stage Archive

      - name: Guard negatives - mismatched tag, dirty tree, substituted archive
        if: steps.mode.outputs.mode != 'publish'
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          DIGEST: ${{ steps.archive.outputs.digest }}
        run: pwsh -NoProfile -File ./build/Invoke-EngineRelease.ps1 -Stage Negatives

      - name: Publish package
        if: steps.mode.outputs.mode == 'publish'
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          DIGEST: ${{ steps.archive.outputs.digest }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pwsh -NoProfile -File ./build/Invoke-EngineRelease.ps1 -Stage Publish

      - name: Report the candidate
        if: always()
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          TAG: ${{ steps.mode.outputs.tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          DIGEST: ${{ steps.archive.outputs.digest }}
        run: pwsh -NoProfile -File ./build/Invoke-EngineRelease.ps1 -Stage Report
