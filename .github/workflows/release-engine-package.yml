name: release-engine-package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish game-engine package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: Configure scoped registry
        working-directory: src/engine
        run: |
          npm config set @the-running-dev:registry https://npm.pkg.github.com

      - name: Verify tag, version, and package availability
        working-directory: src/engine
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > .npmrc
          test "v$(node -p \"require('./package.json').version\")" = "$GITHUB_REF_NAME"
          if npm view "@the-running-dev/game-engine@$(node -p \"require('./package.json').version\")" version >/dev/null 2>&1; then
            echo "Package version already exists"
            exit 1
          fi

      - name: Install dependencies
        working-directory: src/engine
        run: npm ci

      - name: Verify engine and packed consumer
        run: |
          npm --prefix src/engine run typecheck
          npm --prefix src/engine run lint
          npm --prefix src/engine test
          npm --prefix consumer-smoke ci
          npm --prefix consumer-smoke run install:engine
          npm --prefix consumer-smoke run build
          npm --prefix consumer-smoke run smoke

      - name: Publish package
        working-directory: src/engine
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > .npmrc
          npm publish
